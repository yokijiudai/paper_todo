org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# Gradle 优化配置
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# 网络配置 - 增加超时时间
systemProp.http.socketTimeout=120000
systemProp.http.connectionTimeout=120000
systemProp.https.socketTimeout=120000
systemProp.https.connectionTimeout=120000

# 使用 IPv4
java.net.preferIPv4Stack=true

# 关闭 Kotlin 增量编译。
# 插件源码在 C:\...\Pub\Cache（C 盘），工程在 D 盘，Kotlin 增量缓存计算相对路径时会抛
# "this and base files have different roots"，导致 :shared_preferences_android:compileDebugKotlin 失败。
# 关掉只影响编译速度，不影响产物。
kotlin.incremental=false
