<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="app">
<title>今天 · 待办</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<style>
  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: end;
    gap: var(--space-2);
    margin-top: var(--space-3);
  }
  .hero-art { width: 112px; height: 108px; margin-bottom: -4px; }

  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    margin-top: var(--space-5);
  }
  .progress-text {
    font-size: var(--text-xs);
    color: var(--color-muted);
    letter-spacing: 0.03em;
  }
  .dots { display: flex; gap: 6px; align-items: center; }
  .p-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1.6px solid rgba(110, 90, 75, 0.34);
  }
  .p-dot.is-done { background: var(--color-accent); border-color: var(--color-accent); }

  .group { margin-top: var(--space-5); }
  .group-label {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    margin-bottom: var(--space-3);
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--color-muted);
    letter-spacing: 0.04em;
  }
  .group-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--color-line);
  }
</style>
</head>
<body>

<header class="status-bar">
  <span class="status-time">9:41</span>
  <span class="status-icons" aria-hidden="true">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7.6" width="3" height="4.4" rx="1"/><rect x="5" y="5.2" width="3" height="6.8" rx="1"/><rect x="10" y="2.6" width="3" height="9.4" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.4 3.9a10 10 0 0 1 13.2 0"/><path d="M4.1 6.9a6 6 0 0 1 7.8 0"/><circle cx="8" cy="10" r="1.2" fill="currentColor" stroke="none"/></svg>
    <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="0.7" y="0.7" width="21" height="11.6" rx="3.4" stroke="currentColor" stroke-width="1.4" opacity=".45"/><rect x="2.4" y="2.4" width="16" height="8.2" rx="2" fill="currentColor"/><path d="M23.6 4.5v4c1-.3 1.6-1 1.6-2s-.6-1.7-1.6-2Z" fill="currentColor" opacity=".45"/></svg>
  </span>
</header>

      <g transform="rotate(8 60 58)">
        <rect x="28" y="24" width="60" height="64" rx="9" fill="var(--color-sand)" opacity=".85"/>
      </g>
      <g transform="rotate(-5 62 62)">
        <rect x="30" y="28" width="62" height="66" rx="9" fill="var(--color-accent-soft)"/>
      </g>
      <g transform="rotate(1.5 64 64)">
        <rect x="32" y="30" width="62" height="68" rx="10" fill="var(--color-surface)" stroke="var(--color-text)" stroke-width="1.5"/>
        <path d="M44 48h30" stroke="var(--color-line)" stroke-width="3" stroke-linecap="round"/>
        <path d="M44 61h36" stroke="var(--color-line)" stroke-width="3" stroke-linecap="round"/>
        <path d="M44 74h22" stroke="var(--color-line)" stroke-width="3" stroke-linecap="round"/>

    </svg>
  </div>

  <div class="progress-row">

      <span class="p-dot is-done"></span>
      <span class="p-dot"></span>
      <span class="p-dot"></span>
      <span class="p-dot"></span>
    </div>
  </div>

  <section class="group" aria-labelledby="group-open">

      </li>
      <li>

          </span>
          <span class="todo-body">
            <span class="todo-title">审阅新功能分支的 PR</span>
            <span class="todo-meta"><span class="chip">工作</span><span class="todo-time">18:00</span><span class="dot"></span><span>3 个待回复</span></span>
          </span>

      </li>
      <li>
        <a class="todo" href="detail.html">

            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.6c4.6.1 8.3 3.7 8.3 8.3 0 4.8-3.6 8.5-8.4 8.5-4.7 0-8.2-3.5-8.2-8.3 0-4.7 3.4-8.4 8.3-8.5Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>

    </ul>

  <section class="group" aria-labelledby="group-done">
    <h2 class="group-label" id="group-done">今天已完成</h2>
    <ul class="todo-list">
      <li>
        <a class="todo is-done" href="detail.html">

      <li>

          </span>
          <span class="todo-body">
            <span class="todo-title">读完《写作这回事》第 4 章</span>
            <span class="todo-meta"><span class="chip chip--study">学习</span><span class="todo-time">睡前</span></span>

    </ul>
  </section>
</main>
