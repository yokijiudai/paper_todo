<style>
  .someday-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: end;
    gap: var(--space-2);
    margin-top: var(--space-3);
  }
  .someday-art { width: 100px; height: 84px; margin-bottom: -2px; }
  .lede {
    margin-top: var(--space-3);
    font-size: var(--text-sm);
    line-height: 1.6;
    color: var(--color-muted);
  }

  /* 写一条的纸条 */
  .slip {
    position: relative;
    margin-top: var(--space-6);
    padding-top: var(--space-5);
  }
  .slip .field-label { font-size: var(--text-xs); }
  .slip .textarea {
    margin-top: var(--space-2);
    min-height: 96px;
    padding: var(--space-2) 0;
    background: transparent;
    border: 0;
    border-bottom: 1px dashed var(--color-line);
    border-radius: 0;
  }
  .slip .textarea:focus {
    border-bottom-color: var(--color-primary);
    box-shadow: none;
  }
  .slip .picker { margin-top: var(--space-4); }
  .slip .btn { margin-top: var(--space-4); }

  /* 每行右侧「挪到今天」 */
  .todo { padding-right: 6px; }
  .todo-main {
    display: flex;
    align-items: flex-start;
    gap: var(--space-3);
    flex: 1;
    min-width: 0;
  }
  .move-btn {
    flex: 0 0 auto;
    align-self: center;
    width: var(--tap);
    height: var(--tap);
    display: grid;
    place-items: center;
    border-radius: var(--radius-full);
    color: var(--color-muted);
    transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
  }
  .move-btn:active { background: var(--color-primary-soft); color: var(--color-primary-deep); }
  .move-btn svg { width: 18px; height: 18px; }

  .foot-note {
    margin-top: var(--space-5);
    font-size: var(--text-xs);
    color: var(--color-muted);
    letter-spacing: 0.02em;
    text-align: center;
  }
</style>
</head>
