<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="dsh-design" content="app">
<title>本周回顾</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
<style>
  .display { margin-top: var(--space-3); }

  .summary {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    margin-top: var(--space-5);
    padding: var(--space-4) var(--space-2);
  }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .stat + .stat { border-left: 1px solid var(--color-line); }
  .stat-value {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: var(--text-xl);
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
  }
  .stat-value small { font-size: var(--text-xs); font-family: var(--font-sans); font-weight: 400; color: var(--color-muted); margin-left: 2px; }
  .stat-label { font-size: var(--text-xs); color: var(--color-muted); letter-spacing: 0.02em; }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    margin-bottom: var(--space-2);
  }
  .card-note { font-size: var(--text-xs); color: var(--color-muted); }

  /* 换一周：视觉上紧凑，点按区仍是 44 */
  .page-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
  }
  .week-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-height: var(--tap);
    margin: -6px 0;
    padding: 0 10px 0 12px;
    border: 1px solid var(--color-line);
    border-radius: var(--radius-full);
    background: var(--color-surface-2);
    font-family: var(--font-sans);
    font-size: var(--text-xs);
    font-weight: 600;
    color: var(--color-text);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    transition: background var(--dur) var(--ease);
  }
  .week-btn:active { background: var(--color-sand-soft); }
  .week-btn svg { width: 14px; height: 14px; flex: 0 0 auto; color: var(--color-muted); }

  /* ---------- 从底部弹出的周列表 ---------- */
  .sheet-mask {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: flex-end;
  }
  .sheet-mask[hidden] { display: none; }
  .sheet-scrim {
    position: absolute;
    inset: 0;
    border: 0;
    padding: 0;
    background: rgba(43, 29, 20, 0.34);
    animation: fade-in var(--dur) var(--ease);
  }
  .sheet {
    position: relative;
    width: 100%;
    padding: 10px var(--page-x) calc(var(--space-4) + var(--safe-b));
    background: var(--color-surface);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow: 0 -12px 36px rgba(120, 72, 30, 0.18);
    animation: sheet-up 240ms var(--ease);
  }
  .sheet-grip {
    display: block;
    width: 40px;
    height: 4px;
    margin: 0 auto var(--space-4);
    border-radius: var(--radius-full);
    background: var(--color-line);
  }
  /* ---------- 周历头部 ---------- */
  .cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
    margin-bottom: var(--space-2);
  }
  .cal-step {
    width: var(--tap);
    height: var(--tap);
    display: grid;
    place-items: center;
    border-radius: var(--radius-full);
    color: var(--color-text);
    transition: background var(--dur) var(--ease);
  }
  .cal-step:active { background: var(--color-surface-2); }
  .cal-step svg { width: 20px; height: 20px; }
  .cal-title {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: var(--tap);
    padding: 0 var(--space-3);
    border-radius: var(--radius-full);
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: var(--text-md);
    color: var(--color-text);
    font-variant-numeric: tabular-nums;
    transition: background var(--dur) var(--ease);
  }
  .cal-title:active { background: var(--color-surface-2); }
  .cal-title svg { width: 14px; height: 14px; flex: 0 0 auto; color: var(--color-muted); }

  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
  }
  .cal-weekdays span {
    text-align: center;
    font-size: var(--text-xs);
    letter-spacing: 0.04em;
    color: var(--color-muted);
  }

  .cal-week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    align-items: center;
    width: 100%;
    min-height: var(--tap);
    border-radius: var(--radius-sm);
    color: var(--color-text);
    font-size: var(--text-sm);
    font-variant-numeric: tabular-nums;
    transition: background var(--dur) var(--ease);
  }
  .cal-week + .cal-week { margin-top: 2px; }
  .cal-week:active { background: var(--color-surface-2); }
  .cal-week span { padding: 10px 0; text-align: center; }
  .cal-week .is-out { color: var(--color-muted); }
  .cal-week.is-on {
    background: var(--color-primary-soft);
    color: var(--color-primary-deep);
    font-weight: 600;
  }
  .cal-week.is-on .is-out { color: var(--color-primary-deep); }

  .cal-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    margin-top: var(--space-4);
  }
  .cal-foot-text {
    font-size: var(--text-xs);
    color: var(--color-muted);
    letter-spacing: 0.02em;
    line-height: 1.5;
  }
  .cal-foot-text b { color: var(--color-text); font-variant-numeric: tabular-nums; }

  /* ---------- 年 / 月选择 ---------- */
  .pick-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
  }
  .pick-year {
    font-family: var(--font-serif);
    font-weight: 600;
    font-size: var(--text-md);
    color: var(--color-text);
    font-variant-numeric: tabular-nums;
  }
  .pick-months {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-2);
    margin: var(--space-3) 0 0;
  }
  .pick-month {
    min-height: var(--tap);
    border: 1px solid var(--color-line);
    border-radius: var(--radius-sm);
    background: var(--color-surface);
    font-family: var(--font-sans);
    font-size: var(--text-sm);
    color: var(--color-text);
    transition: background var(--dur) var(--ease);
  }
  .pick-month:active { background: var(--color-surface-2); }
  .pick-month.is-on {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: var(--color-primary-ink);
    font-weight: 600;
  }

  @keyframes sheet-up { from { transform: translateY(20px); opacity: 0.6; } to { transform: none; opacity: 1; } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .sheet, .sheet-scrim { animation: none; }
  }
  .chart { width: 100%; height: auto; }

  /* 柱状条可以点，选一天 */
  .chart { cursor: pointer; }
  .chart .col-hit { fill: transparent; }
  .chart .col text { font-size: 12px; }
  .chart .col-bar { fill: var(--color-sand); transition: fill var(--dur) var(--ease); }
  .chart .col.is-on .col-bar { fill: var(--color-accent); }
  .chart .col-count { fill: var(--color-muted); }
  .chart .col.is-on .col-count { fill: var(--color-text); font-weight: 600; }
  .chart .col-day { fill: var(--color-muted); }
  .chart .col.is-on .col-day { fill: var(--color-primary-deep); font-weight: 600; }
  .chart .col:focus { outline: none; }
  .chart .col:focus-visible .col-bar { stroke: var(--color-text); stroke-width: 1.4; }

  .chart-hint {
    margin-top: 2px;
    font-size: var(--text-xs);
    color: var(--color-muted);
    letter-spacing: 0.02em;
  }
  .day-label {
    font-family: var(--font-serif);
    font-size: var(--text-md);
    letter-spacing: 0.01em;
  }
  .day-list { margin-top: var(--space-2); }
  .day-item {
    display: grid;
    grid-template-columns: 16px minmax(0, 1fr) auto;
    align-items: baseline;
    gap: var(--space-3);
    padding: 11px 0;
  }
  .day-item + .day-item { border-top: 1px solid var(--color-line); }
  .day-check {
    width: 16px;
    height: 16px;
    align-self: start;
    margin-top: 1px;
    color: var(--color-accent);
  }
  .day-check svg { display: block; width: 16px; height: 16px; }
  .day-title {
    font-size: var(--text-sm);
    line-height: 1.45;
    color: var(--color-text);
    overflow-wrap: anywhere;
  }
  .day-time {
    font-size: var(--text-xs);
    color: var(--color-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .day-empty { padding: var(--space-3) 0 var(--space-1); font-size: var(--text-sm); color: var(--color-muted); }
</style>
</head>

      </div>

        </button>

<script>
  (function () {
    var sheet = document.getElementById('weekSheet');
    var btn = document.getElementById('weekBtn');
    if (!sheet || !btn) return;

    var calView = document.getElementById('calView');
    var pickView = document.getElementById('pickView');
    var calGrid = document.getElementById('calGrid');
    var calFoot = document.getElementById('calFoot');
    var calTitleText = document.getElementById('calTitleText');
    var pickYear = document.getElementById('pickYear');
    var pickMonths = document.getElementById('pickMonths');

    // 一个先验状态：本周 = 2026 年 10 月
    var state = { year: 2026, month: 10 };
    var thisWeek = { year: 2026, month: 10, startDay: 23 };

    function pad(n) { return (n < 10 ? '0' : '') + n; }
    function daysIn(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
    function firstIndex(y, m) {
      // 原型里把 2026 年 10 月的 1 号排在周日，好让 10.23–10.29 正好占一整行
      if (y === 2026 && m === 10) return 6;
      return (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7;
    }
    function neighbourMonth(kind) {
      if (kind === -1) return state.month === 1 ? 12 : state.month - 1;
      if (kind === 1) return state.month === 12 ? 1 : state.month + 1;
      return state.month;
    }
    function fmt(el) { return el.dataset.m + '.' + pad(Number(el.textContent)); }

    function render() {
      var wd = firstIndex(state.year, state.month);
      var n = daysIn(state.year, state.month);
      var prevN = daysIn(state.year, state.month === 1 ? 12 : state.month - 1);
      var cells = [];
      var i;
      for (i = 0; i < wd; i++) cells.push({ d: prevN - wd + 1 + i, kind: -1 });
      for (i = 1; i <= n; i++) cells.push({ d: i, kind: 0 });
      var k = 1;
      while (cells.length % 7) cells.push({ d: k++, kind: 1 });

      var html = '';
      for (var r = 0; r < cells.length / 7; r++) {
        html += '<button class="cal-week" type="button">';
        for (var c = 0; c < 7; c++) {
          var cell = cells[r * 7 + c];
          html += '<span class="' + (cell.kind ? 'is-out' : '') + '" data-m="' + neighbourMonth(cell.kind) + '">' + cell.d + '</span>';
        }
        html += '</button>';
      }
      calGrid.innerHTML = html;

      calTitleText.textContent = state.year + ' 年 ' + state.month + ' 月';
      if (pickYear) pickYear.textContent = state.year + ' 年';

      // 本周那一行默认选中
      var rows = calGrid.children;
      var rowIndex = -1;
      if (state.year === thisWeek.year && state.month === thisWeek.month) {
        rowIndex = Math.floor((wd + thisWeek.startDay - 1) / 7);
      }
      if (rowIndex > -1 && rows[rowIndex]) {
        rows[rowIndex].classList.add('is-on');
        rows[rowIndex].setAttribute('aria-current', 'true');
        setFoot('已选 <b>' + fmt(rows[rowIndex].children[0]) + ' – ' + fmt(rows[rowIndex].children[6]) + '</b> · 本周 14 件');
      } else {
        setFoot('点一行，选那一周');
      }
      markMonth();
    }

    function setFoot(html) { calFoot.innerHTML = html; }

    function markMonth() {
      if (!pickMonths) return;
      Array.prototype.forEach.call(pickMonths.children, function (el) {
        var on = Number(el.dataset.m) === state.month;
        el.classList.toggle('is-on', on);
        if (on) { el.setAttribute('aria-current', 'true'); } else { el.removeAttribute('aria-current'); }
      });
    }

    // 12 个月份格
    if (pickMonths) {
      for (var m = 1; m <= 12; m++) {
        var b = document.createElement('button');
        b.className = 'pick-month';
        b.type = 'button';
        b.dataset.m = String(m);
        b.textContent = m + ' 月';
        pickMonths.appendChild(b);
      }
      pickMonths.addEventListener('click', function (e) {
        var el = e.target.closest('.pick-month');
        if (!el) return;
        state.month = Number(el.dataset.m);
        showCalendar();
        render();
      });
    }

    function showCalendar() { calView.hidden = false; if (pickView) pickView.hidden = true; }
    function showPicker() { calView.hidden = true; if (pickView) pickView.hidden = false; markMonth(); }

    // 点标题 → 选年 / 月
    var titleBtn = document.getElementById('calTitle');
    if (titleBtn) {
      titleBtn.addEventListener('click', function () {
        if (pickView && !pickView.hidden) { showCalendar(); } else { showPicker(); }
      });
    }
    var yearPrev = document.getElementById('yearPrev');
    var yearNext = document.getElementById('yearNext');
    if (yearPrev) yearPrev.addEventListener('click', function () { state.year -= 1; render(); markMonth(); });
    if (yearNext) yearNext.addEventListener('click', function () { state.year += 1; render(); markMonth(); });

    // 上一 / 下一月
    document.getElementById('calPrev').addEventListener('click', function () {
      state.month -= 1;
      if (state.month < 1) { state.month = 12; state.year -= 1; }
      render();
    });
    document.getElementById('calNext').addEventListener('click', function () {
      state.month += 1;
      if (state.month > 12) { state.month = 1; state.year += 1; }
      render();
    });

    // 点一行选一周
    calGrid.addEventListener('click', function (e) {
      var row = e.target.closest('.cal-week');
      if (!row) return;
      Array.prototype.forEach.call(calGrid.children, function (el) {
        el.classList.remove('is-on');
        el.removeAttribute('aria-current');
      });
      row.classList.add('is-on');
      row.setAttribute('aria-current', 'true');
      setFoot('已选 <b>' + fmt(row.children[0]) + ' – ' + fmt(row.children[6]) + '</b>');
    });

    function open() {
      sheet.hidden = false;
      document.body.style.overflow = 'hidden';
      btn.setAttribute('aria-expanded', 'true');
      showCalendar();
      render();
    }
    function close() {
      sheet.hidden = true;
      document.body.style.overflow = '';
      btn.setAttribute('aria-expanded', 'false');
      btn.focus();
    }
    btn.addEventListener('click', open);
    sheet.addEventListener('click', function (e) {
      if (e.target.closest('[data-close]')) close();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !sheet.hidden) close();
    });

    render();
  })();
</script>

<script>
  (function () {
    var chart = document.querySelector('.chart');
    var list = document.getElementById('dayList');
    var dayTitle = document.getElementById('dayTitle');
    var dayCount = document.getElementById('dayCount');
    if (!chart || !list) return;

    var CHECK = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="currentColor"/><path d="M7.9 12.3l2.8 2.9 5.6-6.3" stroke="var(--color-surface)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    // 这一周每天完成的事（和柱状条的 3 / 1 / 4 / 2 / 2 / 1 / 1 对应）
    var days = [
      { date: '10 月 23 日', items: [
        ['整理上周会议纪要', '09:20'],
        ['给团队发本周排期', '11:05'],
        ['傍晚遛狗 20 分钟', '18:40']
      ] },
      { date: '10 月 24 日', items: [
        ['回复设计评审的三条意见', '15:10']
      ] },
      { date: '10 月 25 日', items: [
        ['写完 Q4 提案的大纲', '09:50'],
        ['和高岚对齐接口字段', '14:20'],
        ['把阳台的土换了', '17:30'],
        ['读完《写作这回事》第 3 章', '21:40']
      ] },
      { date: '10 月 26 日', items: [
        ['修掉登录页的错位', '10:15'],
        ['交水电费', '20:05']
      ] },
      { date: '10 月 27 日', items: [
        ['准备周会要讲的三页', '11:30'],
        ['跑步 5 公里', '19:10']
      ] },
      { date: '10 月 28 日', items: [
        ['把简历更新到最新', '16:00']
      ] },
      { date: '10 月 29 日', items: [
        ['讲完周会那三页', '10:00']
      ] }
    ];

    var cols = Array.prototype.slice.call(chart.querySelectorAll('.col'));

    function esc(s) {
      return s.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; });
    }

    function show(i) {
      var d = days[i];
      if (!d) return;
      dayTitle.textContent = d.date;
      dayCount.textContent = d.items.length + ' 件';
      if (!d.items.length) {
        list.innerHTML = '<li class="day-empty">这天没有完成记录</li>';
      } else {
        list.innerHTML = d.items.map(function (it) {
          return '<li class="day-item">' +
            '<span class="day-check">' + CHECK + '</span>' +
            '<span class="day-title">' + esc(it[0]) + '</span>' +
            '<span class="day-time">' + it[1] + '</span>' +
          '</li>';
        }).join('');
      }
      cols.forEach(function (c, j) {
        c.classList.toggle('is-on', j === i);
      });
      chart.setAttribute('aria-valuenow', String(i));
      chart.setAttribute('aria-valuetext', d.date + '，完成 ' + d.items.length + ' 件');
    }

    // 整条柱和它两边的空隙都算一天的点击区，按位置取最近的一列
    chart.addEventListener('click', function (e) {
      var r = chart.getBoundingClientRect();
      if (!r.width) return;
      var i = Math.floor(((e.clientX - r.left) / r.width) * 310 / 42);
      show(Math.max(0, Math.min(days.length - 1, i)));
    });

    // 键盘：左右方向键切换那一天
    chart.addEventListener('keydown', function (e) {
      var n = Number(chart.getAttribute('aria-valuenow'));
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        n += e.key === 'ArrowRight' ? 1 : -1;
        show(Math.max(0, Math.min(days.length - 1, n)));
      } else if (e.key === 'Home') {
        e.preventDefault(); show(0);
      } else if (e.key === 'End') {
        e.preventDefault(); show(days.length - 1);
      }
    });

    // 默认停在件数最多的一天
    show(2);
  })();
</script>
